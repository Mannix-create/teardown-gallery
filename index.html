<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teardown-galleri</title>
<meta name="description" content="Interaktiva 3D-simulatorer av maskiner. Öppna, vrid och plocka isär dem i webbläsaren.">
<meta property="og:type" content="website">
<meta property="og:title" content="Teardown-galleri">
<meta property="og:description" content="Interaktiva 3D-simulatorer av maskiner. Öppna, vrid och plocka isär dem i webbläsaren.">
<meta property="og:url" content="https://mannix-create.github.io/teardown-gallery/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --ink: #17161a; --mute: #6b6870; --line: #e2ded6;
    --accent: #d0592a; --accent-ink: #ffffff; --shadow: 0 1px 2px rgba(23,22,26,.06), 0 8px 24px rgba(23,22,26,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214; --surface: #1c1c20; --ink: #f1efeb; --mute: #9b98a0; --line: #2c2c32;
      --accent: #ec7a4b; --accent-ink: #121214; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121214; --surface: #1c1c20; --ink: #f1efeb; --mute: #9b98a0; --line: #2c2c32;
    --accent: #ec7a4b; --accent-ink: #121214; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 24px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 40px; }
  .kicker { font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.05; letter-spacing: -.025em; margin: 0; font-weight: 700; }
  .lede { color: var(--mute); max-width: 52ch; margin: 12px 0 0; }
  .count { font: 500 13px/1 "JetBrains Mono", monospace; color: var(--mute); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s; }
  .card:hover { transform: translateY(-3px); }
  .thumb { display: block; aspect-ratio: 1200 / 630; background: var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  h2 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  h2 a { color: inherit; text-decoration: none; }
  .text { color: var(--mute); font-size: 14.5px; margin: 0; flex: 1; }
  .meta { font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--mute); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 14px/1 Inter, sans-serif; padding: 10px 14px; border-radius: 9px; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 48px 24px; text-align: center; color: var(--mute); }
  footer { margin-top: 56px; color: var(--mute); font-size: 13px; }
  footer a { color: inherit; }
  @media (max-width: 480px) { .wrap { padding: 40px 16px 64px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="kicker">Teardown-galleri</p>
      <h1>Maskiner du kan plocka isär</h1>
      <p class="lede">Interaktiva 3D-simulatorer. Öppna en, dra för att vrida, tryck på knapparna och se delen som gör jobbet.</p>
    </div>
    <span class="count" id="count"></span>
  </header>
  <main class="grid" id="grid" aria-live="polite"></main>
  <footer>Simulatorerna byggs med <a href="https://github.com/Mannix-create/teardown">teardown</a>. Första laddningen tar några sekunder medan grafiken kompileras.</footer>
</div>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
  const grid = document.getElementById('grid');
  fetch('gallery.json', {cache: 'no-cache'})
    .then((r) => r.json())
    .then(({items = []}) => {
      document.getElementById('count').textContent = `${items.length} ${items.length === 1 ? 'simulator' : 'simulatorer'}`;
      if (!items.length) { grid.innerHTML = '<p class="empty">Inga simulatorer än.</p>'; return; }
      grid.innerHTML = items.map((it) => {
        const href = `sims/${encodeURIComponent(it.slug)}/`;
        return `<article class="card">
          <a class="thumb" href="${href}"><img src="${href}card.jpg" alt="${esc(it.title)}" loading="lazy" width="1200" height="630"></a>
          <div class="body">
            <h2><a href="${href}">${esc(it.title)}</a></h2>
            <p class="text">${esc(it.text)}</p>
            <p class="meta">${esc(it.added)} · ${esc(it.kb)} KB${it.credit ? ' · ' + esc(it.credit) : ''}</p>
            <div class="actions">
              <a class="btn primary" href="${href}">Öppna</a>
              <button class="btn" type="button" data-share="${href}" data-title="${esc(it.title)}">Dela</button>
            </div>
          </div>
        </article>`;
      }).join('');
    })
    .catch(() => { grid.innerHTML = '<p class="empty">Kunde inte läsa galleriet.</p>'; });
  grid.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-share]');
    if (!b) return;
    const url = new URL(b.dataset.share, location.href).href;
    try {
      if (navigator.share) { await navigator.share({title: b.dataset.title, url}); return; }
      await navigator.clipboard.writeText(url);
      b.textContent = 'Länk kopierad';
    } catch { b.textContent = 'Kopiera: ' + url; }
    setTimeout(() => { b.textContent = 'Dela'; }, 2500);
  });
</script>
</body>
</html>
